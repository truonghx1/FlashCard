<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-2xl mx-auto px-4 py-6 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="mb-4 flex items-center gap-3">
      <button id="backBtn" class="hidden text-slate-500 hover:text-slate-800 transition" aria-label="Quay lại">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <h1 id="title" class="text-xl sm:text-2xl font-bold text-indigo-600">📚 Flashcard</h1>
    </header>

    <!-- HOME: list of decks -->
    <section id="homeView" class="flex-1">
      <p class="text-slate-500 mb-4 text-sm">Chọn một bộ từ vựng để bắt đầu học:</p>
      <div id="deckList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>

    <!-- STUDY: flashcard -->
    <section id="studyView" class="hidden flex-1 flex flex-col">

      <!-- Progress -->
      <div class="flex items-center justify-between mb-3 text-sm text-slate-500">
        <span id="counter">0 / 0</span>
        <button id="speakBtn" class="flex items-center gap-1 hover:text-indigo-600 transition" aria-label="Phát âm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M19 5a9 9 0 010 14M5 9v6h4l5 5V4L9 9H5z" />
          </svg>
          Đọc lại
        </button>
      </div>

      <!-- Card -->
      <div class="flex-1 flex items-center justify-center mb-5">
        <div id="card" class="card w-full" tabindex="0" role="button" aria-label="Lật thẻ">
          <div class="card-inner">
            <div class="card-face card-front">
              <span id="frontText"></span>
            </div>
            <div class="card-face card-back">
              <span id="backText"></span>
            </div>
          </div>
        </div>
      </div>
      <p class="text-center text-xs text-slate-400 mb-4">Nhấn vào thẻ để lật 🔄</p>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-3 pb-4">
        <button id="prevBtn" class="px-5 py-3 rounded-xl bg-white shadow hover:bg-slate-50 active:scale-95 transition font-medium flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          Previous
        </button>
        <button id="nextBtn" class="px-5 py-3 rounded-xl bg-indigo-600 text-white shadow hover:bg-indigo-700 active:scale-95 transition font-medium flex items-center gap-1">
          Next
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
